[project]
name = "lumintobot"
version = "1.2"
description = "Бот люминта с клёвыми функциями!"
readme = "README.md"
requires-python = ">=3.14, <3.15"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.26.0",
    "aiohttp>=3.13.3",
    "aioping>=0.4.0",
    "asyncmy>=0.2.10",
    "cryptg>=0.5.2",
    "cryptography>=46.0.3",
    "groq>=1.1.0",
    "httpx[socks]>=0.28.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "orjson>=3.11.4",
    "psutil>=7.1.3",
    "pymorphy3>=2.0.6",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "seaborn>=0.13.2",
    "telethon>=1.42.0",
    "uvloop>=0.22.1",
]

[tool.ruff]
exclude = ["depr", "scripts", ".venv"]
unsafe-fixes = true
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "Q",
    "I",
    "UP",
    "PERF",
    "ASYNC",
    "C4",
    "ISC",
    "RET",
    "FURB",
    "FLY",
    "TRY",
    "PTH",
]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
invalid-type-arguments = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
invalid-assignment = "ignore"
no-matching-overload = "ignore"
